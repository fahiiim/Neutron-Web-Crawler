apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc-search-gateway
  namespace: neutron
  labels:
    app: svc-search-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: svc-search-gateway
  template:
    metadata:
      labels:
        app: svc-search-gateway
    spec:
      containers:
      - name: gateway
        image: neutron/gateway:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: neutron-config
        - secretRef:
            name: neutron-secrets
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "384Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 3
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: svc-search-gateway
  namespace: neutron
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: svc-search-gateway

