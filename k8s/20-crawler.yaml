apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc-crawler-worker
  namespace: neutron
  labels:
    app: svc-crawler-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: svc-crawler-worker
  template:
    metadata:
      labels:
        app: svc-crawler-worker
    spec:
      containers:
      - name: crawler
        image: neutron/crawler:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8001
        envFrom:
        - configMapRef:
            name: neutron-config
        - secretRef:
            name: neutron-secrets
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "768Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: svc-crawler-worker
  namespace: neutron
spec:
  type: ClusterIP
  ports:
  - port: 8001
    targetPort: 8001
    protocol: TCP
    name: http
  selector:
    app: svc-crawler-worker

