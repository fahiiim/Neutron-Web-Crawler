apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc-stealth-renderer
  namespace: neutron
  labels:
    app: svc-stealth-renderer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: svc-stealth-renderer
  template:
    metadata:
      labels:
        app: svc-stealth-renderer
    spec:
      containers:
      - name: renderer
        image: neutron/renderer:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8002
        envFrom:
        - configMapRef:
            name: neutron-config
        - secretRef:
            name: neutron-secrets
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1024Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: svc-stealth-renderer
  namespace: neutron
spec:
  type: ClusterIP
  ports:
  - port: 8002
    targetPort: 8002
    protocol: TCP
    name: http
  selector:
    app: svc-stealth-renderer

