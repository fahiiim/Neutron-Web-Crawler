apiVersion: v1
kind: Secret
metadata:
  name: neutron-secrets
  namespace: neutron
type: Opaque
stringData:
  TURSO_AUTH_TOKEN: "your_turso_jwt_token_here"
  R2_ACCESS_KEY_ID: "your_cloudflare_r2_access_key"
  R2_SECRET_ACCESS_KEY: "your_cloudflare_r2_secret_key"
  INTERNAL_API_KEY: "neutron-internal-cluster-secret-key-64-hex"

