name: Neutron CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Run Unit Tests & Syntax Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Syntax & Critical Lint Checks
        run: |
          python -m compileall -q spaces services scripts tests neutron_rpc
          ruff check --select E9,F63,F7,F82,F401 spaces services scripts tests

      - name: Set up Node.js & Build React Frontend
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build React SPA Bundle
        run: |
          cd frontend
          npm ci
          npm run build
          rm -rf ../spaces/gateway/static
          cp -r ../spaces/crawler/static ../spaces/gateway/static

      - name: Execute Test Suite
        run: |
          python -m unittest discover -s tests -v

  database-migration:
    name: Apply Turso Database Migrations
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Migration Dependencies
        run: |
          pip install libsql-client python-dotenv

      - name: Run Schema Migration Against Turso
        run: |
          if [ -n "$TURSO_DATABASE_URL" ] && [ -n "$TURSO_AUTH_TOKEN" ]; then
            python scripts/init_turso.py
          else
            echo "Skipping Turso migration: repository secrets not set."
          fi
