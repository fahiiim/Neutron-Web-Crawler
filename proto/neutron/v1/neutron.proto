syntax = "proto3";

package neutron.v1;

message Citation {
  int32 index = 1;
  string url = 2;
  string url_hash = 3;
  string title = 4;
  string domain = 5;
}

message EvaluationMetrics {
  double confidence_score = 1;
  double query_coverage = 2;
  double grounding_faithfulness = 3;
  string relevance_grade = 4;
  repeated string matched_concepts = 5;
  repeated string missing_concepts = 6;
  string evaluation_summary = 7;
}

message GroundedAnswer {
  string summary = 1;
  repeated Citation citations = 2;
  string mode = 3;
  EvaluationMetrics evaluation = 4;
}

message SubpageDocument {
  string id = 1;
  string url = 2;
  string title = 3;
  string text = 4;
}

message SearchDocument {
  string url_hash = 1;
  string url = 2;
  string title = 3;
  string snippet = 4;
  double score = 5;
  string crawled_at = 6;
  string full_markdown = 7;
  string full_text = 8;
  repeated string highlights = 9;
  repeated SubpageDocument subpages = 10;
}

message StatsSnapshot {
  int64 pages_indexed = 1;
  int64 domains_covered = 2;
  int64 frontier_pending = 3;
  int64 payloads_stored = 4;
  bool connected = 5;
}

message DiscoveryMetric {
  string source = 1;
  int32 urls_found = 2;
  int32 duration_ms = 3;
  string status = 4;
  string error = 5;
}

message CrawlOutcome {
  bool ok = 1;
  bool robots_blocked = 2;
  string error = 3;
  string domain = 4;
  int32 duration_ms = 5;
  SearchDocument document = 6;
}

message QueryIndexRequest {
  string query = 1;
  int32 limit = 2;
  string mode = 3;
  bool include_markdown = 4;
  repeated string include_domains = 5;
  repeated string exclude_domains = 6;
  string search_type = 7;
  string category = 8;
  string start_published_date = 9;
  string end_published_date = 10;
  int32 subpages = 11;
  repeated string subpage_targets = 12;
}

message QueryIndexResponse {
  repeated SearchDocument results = 1;
  GroundedAnswer answer = 2;
  int32 duration_ms = 3;
  bool has_answer = 4;
  EvaluationMetrics evaluation = 5;
}

message SynthesizeAnswerRequest {
  string query = 1;
  repeated SearchDocument documents = 2;
  bool include_markdown = 3;
  int32 max_sentences = 4;
}

message SynthesizeAnswerResponse {
  repeated SearchDocument results = 1;
  GroundedAnswer answer = 2;
  bool has_answer = 3;
  EvaluationMetrics evaluation = 4;
}

message GetDocumentRequest {
  string url_hash = 1;
}

message GetDocumentResponse {
  bool found = 1;
  string url_hash = 2;
  string url = 3;
  string title = 4;
  string crawled_at = 5;
  string full_markdown = 6;
  string source = 7;
}

message SuggestRequest {
  string query = 1;
  int32 limit = 2;
}

message SuggestResponse {
  string query = 1;
  repeated string suggestions = 2;
}

message GetTrendingRequest {
  int32 limit = 1;
}

message TrendingTopic {
  string topic = 1;
  int64 hits = 2;
}

message GetTrendingResponse {
  repeated TrendingTopic trending = 1;
}

message GetStatsRequest {}

message GetStatsResponse {
  StatsSnapshot stats = 1;
}

message RecordHotTopicRequest {
  string query = 1;
}

message RecordHotTopicResponse {
  bool ok = 1;
}

message DiscoverAndCrawlRequest {
  string query = 1;
  int32 max_pages = 2;
  string mode = 3;
  repeated string skip_urls = 4;
  bool include_full_text = 5;
}

message DiscoverAndCrawlResponse {
  repeated SearchDocument documents = 1;
  repeated DiscoveryMetric metrics = 2;
}

message DiscoverSeedsRequest {
  string query = 1;
  int32 max_urls = 2;
  string mode = 3;
}

message DiscoverSeedsResponse {
  repeated string urls = 1;
  repeated DiscoveryMetric metrics = 2;
}

message CrawlUrlRequest {
  string url = 1;
  string query = 2;
  bool fast_live = 3;
  bool include_full_text = 4;
  bool check_robots = 5;
  bool force_refresh = 6;
}

message CrawlUrlResponse {
  CrawlOutcome outcome = 1;
}

message StreamCrawlRequest {
  string query = 1;
  int32 max_pages = 2;
  string mode = 3;
  repeated string skip_urls = 4;
  bool include_full_text = 5;
  bool force_refresh = 6;
}

message CrawlStreamEvent {
  string event_type = 1;
  DiscoveryMetric metric = 2;
  CrawlOutcome outcome = 3;
  string url = 4;
  string domain = 5;
  string message = 6;
}

message GatewaySearchRequest {
  string query = 1;
  int32 limit = 2;
  string mode = 3;
  bool include_markdown = 4;
  bool refresh = 5;
  repeated string include_domains = 6;
  repeated string exclude_domains = 7;
  string search_type = 8;
  string category = 9;
  string start_published_date = 10;
  string end_published_date = 11;
  int32 subpages = 12;
  repeated string subpage_targets = 13;
}

message GatewaySearchResponse {
  string query = 1;
  string mode = 2;
  string source = 3;
  int32 total = 4;
  GroundedAnswer answer = 5;
  bool has_answer = 6;
  repeated SearchDocument results = 7;
  EvaluationMetrics evaluation = 8;
}

message BatchGetDocumentsRequest {
  repeated string urls = 1;
  repeated string url_hashes = 2;
  string highlight_query = 3;
  int32 max_characters = 4;
  int32 subpages = 5;
  repeated string subpage_targets = 6;
}

message BatchGetDocumentsResponse {
  repeated SearchDocument documents = 1;
}

message FindSimilarRequest {
  string url = 1;
  string url_hash = 2;
  int32 limit = 3;
  bool exclude_source_domain = 4;
  int32 subpages = 5;
  repeated string subpage_targets = 6;
}

message FindSimilarResponse {
  repeated SearchDocument results = 1;
}

service SearchService {
  rpc QueryIndex(QueryIndexRequest) returns (QueryIndexResponse);
  rpc SynthesizeAnswer(SynthesizeAnswerRequest) returns (SynthesizeAnswerResponse);
  rpc GetDocument(GetDocumentRequest) returns (GetDocumentResponse);
  rpc BatchGetDocuments(BatchGetDocumentsRequest) returns (BatchGetDocumentsResponse);
  rpc FindSimilar(FindSimilarRequest) returns (FindSimilarResponse);
  rpc Suggest(SuggestRequest) returns (SuggestResponse);
  rpc GetTrending(GetTrendingRequest) returns (GetTrendingResponse);
  rpc GetStats(GetStatsRequest) returns (GetStatsResponse);
  rpc RecordHotTopic(RecordHotTopicRequest) returns (RecordHotTopicResponse);
}

service CrawlerService {
  rpc DiscoverAndCrawl(DiscoverAndCrawlRequest) returns (DiscoverAndCrawlResponse);
  rpc DiscoverSeeds(DiscoverSeedsRequest) returns (DiscoverSeedsResponse);
  rpc CrawlUrl(CrawlUrlRequest) returns (CrawlUrlResponse);
  rpc StreamCrawl(StreamCrawlRequest) returns (stream CrawlStreamEvent);
}

service GatewayService {
  rpc Search(GatewaySearchRequest) returns (GatewaySearchResponse);
  rpc BatchGetDocuments(BatchGetDocumentsRequest) returns (BatchGetDocumentsResponse);
  rpc FindSimilar(FindSimilarRequest) returns (FindSimilarResponse);
  rpc Suggest(SuggestRequest) returns (SuggestResponse);
  rpc GetStats(GetStatsRequest) returns (GetStatsResponse);
  rpc GetDocument(GetDocumentRequest) returns (GetDocumentResponse);
}

